[package]
name = "kcs-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "sync"] }
tokio-rustls = { version = "0.26.5", default-features = false }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1.0.9"
